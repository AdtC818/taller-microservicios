spring.application.name=customerservice
server.port=8080

# Conexión a MySQL (XAMPP usa el puerto 3306 por defecto)
spring.datasource.url=jdbc:mysql://localhost:3306/customer?useSSL=false&serverTimezone=UTC
spring.datasource.username=customer
spring.datasource.password=customer123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Conexión a Eureka (Elías lo necesitará)
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka